# Twice a day: stand/gate/terminal data from OpenStreetMap for every airport, one file per airport on the
# "stands" branch. The world is fetched in 84 tiles (several Overpass servers in parallel), then split per airport.
# The app reads these files first and only asks Overpass live for airports that have none.
name: Stand data

on:
  schedule:
    - cron: "17 3,15 * * *"   # 03:17 and 15:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stands
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Keep the files of the last run (airports in tiles that fail now keep their old data)
        run: |
          mkdir out
          if git fetch -q origin stands; then
            git --work-tree=out checkout FETCH_HEAD -- . && git reset -q
            git rev-parse 'FETCH_HEAD^{tree}' > prev_tree
          fi
          ls out | wc -l
      - name: Build stand data
        env:
          STANDS_MINUTES: "60"
        run: python3 .github/scripts/stands.py airports.json out
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          git init -q -b stands
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if [ "$(git write-tree)" = "$(cat ../prev_tree 2>/dev/null)" ]; then echo "nothing new"; exit 0; fi
          git commit -qm "Stand data from OpenStreetMap (ODbL)"
          # one orphan commit, force-pushed: the branch never grows
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" stands
